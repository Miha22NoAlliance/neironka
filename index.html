<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея</title>
  <style>
    body { margin: 0; padding: 20px; background: #0d1117; color: #c9d1d9; font-family: sans-serif; }
    h1 { text-align: center; margin-bottom: 24px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .gallery img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; transition: transform 0.2s; cursor: pointer; }
    .gallery img:hover { transform: scale(1.03); }
  </style>
</head>
<body>
  <h1>Галерея PHOTO</h1>
  <div class="gallery" id="gallery"></div>
  <script>
    fetch('https://api.github.com/repos/Miha22NoAlliance/neironka/contents/PHOTO')
      .then(res => res.json())
      .then(files => {
        const gallery = document.getElementById('gallery');
        const imgExt = /\.(jpe?g|png|gif|webp)$/i;
        files.filter(f => f.type === 'file' && imgExt.test(f.name)).forEach(file => {
          const img = document.createElement('img');
          img.src = file.download_url;
          img.loading = 'lazy';
          img.onclick = () => window.open(file.download_url, '_blank');
          gallery.appendChild(img);
        });
      })
      .catch(err => {
        document.getElementById('gallery').innerText = 'Ошибка загрузки файлов: ' + err.message;
      });
  </script>
</body>
</html>
